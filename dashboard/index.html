<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchor — The memory layer for your AI agents</title>
    <meta
      name="description"
      content="Anchor is the memory layer for your AI agents — remote MCP search and persistent memory across runtimes."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0F0D" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('anchor-theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
