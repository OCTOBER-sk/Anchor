name = "anchor-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "AGENT_KEYS"
id = "f2443091f72c4ccc8938aa8bff3e1d55"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "ce7af9757deb44fd975d3eb47beccb4b"

[[kv_namespaces]]
binding = "RESPONSE_CACHE"
id = "f2e342c2ca2b43ae9fdcf5432e5d26ab"

[triggers]
crons = ["0 0 */4 * *"]

[vars]
ALLOWED_ORIGINS = "https://claude.ai,https://anchor-dashboard-5mp.pages.dev,https://*.anchor-dashboard-5mp.pages.dev"
TAVILY_RESERVE_CREDITS = "100"

# Secrets set via `wrangler secret put <NAME>`, never committed:
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, SUPABASE_URL,
#   SUPABASE_SERVICE_ROLE_KEY, CEREBRAS_API_KEY, GEMINI_API_KEY,
#   TAVILY_API_KEY, APIFY_API_TOKEN
